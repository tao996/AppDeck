[package]
name = "flutter-launcher"
version = "0.1.0"
description = "Flutter App Launcher & Release Manager (WindTerm style)"
authors = ["you"]
edition = "2024"
# src/bin/ 下还有诊断工具 pty_probe，需显式指定默认二进制
default-run = "flutter-launcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 备案：解析 APK 签名块里的证书，取公钥与 MD5（JDK 17 的 keytool 已不打印 MD5）
x509-parser = "0.16"
md-5 = "0.10"
base64 = "0.22"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# 单实例：两个进程同时写 state.json 会互相覆盖
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

